[pytest]
# Run the whole suite from the repo root: `python -m pytest`.
# Tests read data/ via repo-root-relative paths.
filterwarnings =
    # Starlette's TestClient warns about httpx; out of our control, and installing
    # httpx2 offline isn't an option. Scope the ignore to this exact message.
    ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning
    ignore:Using `httpx` with `starlette.testclient` is deprecated
