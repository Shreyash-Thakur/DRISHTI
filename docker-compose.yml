services:
  backend:
    build: ./backend
    container_name: drishti-backend
    ports:
      - "8000:8000"
    environment:
      DRISHTI_DB_PATH: /data/drishti.db
      DRISHTI_TOPOLOGY_PATH: /data/topology.json
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  simulator:
    build: ./simulator
    container_name: drishti-simulator
    ports:
      - "8100:8100"
    environment:
      SIM_BACKEND_URL: http://backend:8000
      SIM_TOPOLOGY_PATH: /data/topology.json
      SIM_INTERVAL_SECONDS: "5"
    volumes:
      - ./data:/data
    depends_on:
      backend:
        condition: service_healthy

  ml:
    build: ./ml
    container_name: drishti-ml
    ports:
      - "8200:8200"
    environment:
      ML_BACKEND_HTTP_URL: http://backend:8000
      ML_BACKEND_WS_URL: ws://backend:8000/ws/live
      ML_SIMULATOR_URL: http://simulator:8100
      ML_DB_PATH: /data/drishti.db
      ML_TOPOLOGY_PATH: /data/topology.json
      ML_MODEL_DIR: /app/models
    volumes:
      - ./data:/data
      - ./ml/models:/app/models
    depends_on:
      backend:
        condition: service_healthy

  rca:
    build: ./rca
    container_name: drishti-rca
    ports:
      - "8300:8300"
    environment:
      RCA_BACKEND_WS_URL: ws://backend:8000/ws/live
      RCA_BACKEND_HTTP_URL: http://backend:8000
      RCA_ML_URL: http://ml:8200
      RCA_TOPOLOGY_PATH: /data/topology.json
    volumes:
      - ./data:/data
    depends_on:
      backend:
        condition: service_healthy

  copilot:
    build: ./copilot
    container_name: drishti-copilot
    ports:
      - "8400:8400"
    environment:
      # Ollama runs on the HOST (not in compose). On Docker Desktop
      # host.docker.internal resolves to the host; on Linux add the extra_hosts
      # mapping below (host-gateway) to reach it.
      COPILOT_OLLAMA_URL: http://host.docker.internal:11434
      COPILOT_MODEL: qwen3:8b
      COPILOT_RCA_URL: http://rca:8300
      COPILOT_RUNBOOKS_DIR: /data/runbooks
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/data
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    image: python:3.11-slim
    container_name: drishti-frontend
    working_dir: /site
    command: python -m http.server 8080
    ports:
      - "8080:8080"
    volumes:
      - ./frontend:/site
    depends_on:
      backend:
        condition: service_healthy
